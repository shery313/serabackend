<!DOCTYPE html>
<html>
<head>
    <title>New Transaction Verified</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #f8f9fa; padding: 10px; text-align: center; }
        .content { padding: 20px; }
        .footer { margin-top: 20px; font-size: 0.9em; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>New Transaction Verified</h2>
        </div>
        <div class="content">
            <p>A new transaction has been successfully verified:</p>
            <p><strong>Transaction ID:</strong> {{ transaction_id }}</p>
            <p><strong>Order ID:</strong> {{ order_id }}</p>
        </div>
        <div class="footer">
            <p>This is an automated notification from your payment system.</p>
        </div>
    </div>
</body>
</html>
