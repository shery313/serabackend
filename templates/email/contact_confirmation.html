<!DOCTYPE html>
<html>
<head>
    <title>Thank You for Contacting Us</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #f8f9fa; padding: 10px; text-align: center; }
        .content { padding: 20px; }
        .footer { margin-top: 20px; font-size: 0.9em; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Thank You for Contacting Us</h2>
        </div>
        <div class="content">
            <p>Dear {{ name }},</p>
            <p>Thank you for contacting us regarding "{{ subject }}". We have received your message and will get back to you soon.</p>
            <p>We appreciate your interest and will respond as quickly as possible.</p>
        </div>
        <div class="footer">
            <p>Best regards,<br>Your Company Team</p>
        </div>
    </div>
</body>
</html>
